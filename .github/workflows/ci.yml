name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # RSpec and Cucumber both need a live Postgres, so they share one job rather
  # than each provisioning their own service container. A failure here is the
  # point of the exercise: the suite is the only signal that a change did not
  # break existing behaviour.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Matches the fallbacks in config/database.yml so the suite runs with
          # no extra secret handling. These are throwaway credentials for an
          # ephemeral CI container, not a real database.
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: salary_management_test
        ports:
          - 5432:5432
        # --health-cmd lets the job wait for Postgres to accept connections, so
        # the first migration does not race the server's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      # Overridden below; Rails reads these in preference to the defaults.
      SALARY_MANAGEMENT_DATABASE_USERNAME: admin
      SALARY_MANAGEMENT_DATABASE_PASSWORD: admin
      SALARY_MANAGEMENT_TEST_DATABASE_NAME: salary_management_test
      # The suite never reaches S3: Active Storage uses its :test service, and
      # importing a CSV in a request spec writes to tmp/storage.
      AWS_ACCESS_KEY_ID: not-used-in-test
      AWS_SECRET_ACCESS_KEY: not-used-in-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Create the database and load the schema
        run: bin/rails db:test:prepare

      # Both suites write into one merged resultset, so the floor is judged on
      # what the two of them reach together rather than on either alone. Cucumber
      # runs first because SimpleCov's default merge window is 600s; the reverse
      # order is equally correct, but this way the standalone Cucumber number is
      # in the log before RSpec reports the merged total.
      - name: Run Cucumber
        run: bundle exec cucumber --format progress --publish-quiet

      - name: Run RSpec
        run: bundle exec rspec --format progress

      # No separate coverage step: SimpleCov exits non-zero from the runs above
      # when the merged total falls under the floor in .simplecov, so the build
      # fails on a regression instead of printing a number nobody reads. The
      # threshold lives in .simplecov so there is one place to change it.
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/index.html
          retention-days: 7

      # Catches the class of regression that a green suite misses: a model or
      # migration that is valid but eager-loads to a constant that does not
      # resolve. Only meaningful when eager loading is on, hence RAILS_ENV=test.
      - name: Verify autoloading
        run: bin/rails zeitwerk:check

