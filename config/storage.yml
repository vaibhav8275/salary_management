test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

amazon:
  service: S3
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "salary-management-1") %>
  # No access_key_id / secret_access_key on purpose: the AWS SDK default chain
  # reads AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from the environment, so the
  # credentials never appear in a file that git tracks. Set them in .env locally
  # (.env.example is the committed template) and in config/deploy.yml for Kamal.

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

